<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SALOMÉ 2.2</title><style>body{font:16px system-ui;max-width:650px;margin:auto;padding:18px;background:#f2f6f7;color:#17323a}button,input,select{font:inherit;padding:10px;margin:5px;border:1px solid #aab;border-radius:8px}button{background:#155e63;color:white}video{display:none}canvas{width:100%;background:#222}section{background:white;padding:15px;margin:12px 0;border-radius:12px}#status{font-weight:bold}table{width:100%} .good{color:#087443}.bad{color:#b42318} #grade{font-size:48px;font-weight:bold} button:disabled{opacity:.45}td{padding:5px;border-bottom:1px solid #ddd}</style><h1>SALOMÉ 2.2</h1><p>Creado por Américo Sanclemente · Prototipo OMR</p><section>Clave correcta (8 respuestas A–D)<div id="keys"></div><label>Código del estudiante <input id="student" autocomplete="off"></label><br><button id="start">Activar cámara</button><button id="stop">Detener</button><button id="next">Siguiente examen</button></section><video id="video" playsinline muted></video><canvas id="view" width="800" height="1000"></canvas><p id="status">Muestre los cuatro cuadrados negros completos.</p><section id="result">Sin lectura</section><button id="save" disabled>Confirmar y registrar</button><button id="csv">Exportar CSV</button><section id="records"></section><script>
const $=x=>document.getElementById(x), letters='ABCD', keys=$('keys');for(let i=0;i<8;i++){let s=document.createElement('select');s.setAttribute('aria-label','Pregunta '+(i+1));for(let a of letters)s.add(new Option(a,a));s.value=letters[i%4];keys.append(s)}
let stream=null,timer=null,last='',stable=0,pending=null,locked=false,records=[],audio=null,saved=false;try{records=JSON.parse(localStorage.getItem('salome2')||'[]')}catch(e){};const c=$('view'),ctx=c.getContext('2d',{willReadFrequently:true}),v=$('video');let W=800,H=1000;
function show(){ $('records').textContent=records.length+' exámenes registrados: '+records.map(r=>r.id+' ('+r.grade+')').join(', ')}show();
function reset(){last='';stable=0;pending=null;locked=false;saved=false;$('save').disabled=true;$('result').textContent='Sin lectura';for(const k of keys.children)k.disabled=false;}
$('next').onclick=()=>{reset();$('student').value='';$('status').textContent='Alinee el siguiente examen'};
$('start').onclick=async()=>{try{if(!navigator.mediaDevices)throw Error('Se requiere HTTPS');if(stream)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();await audio.resume()}catch(e){}stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});v.srcObject=stream;await v.play();timer=setInterval(scan,200)}catch(e){$('status').textContent='No se pudo activar la cámara: '+e.message;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}};
$('stop').onclick=()=>{clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null};
function beep(){try{let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.18)}catch(e){}}
function render(){let key=[...keys.children].map(s=>s.value),n=pending.filter((a,i)=>a===key[i]).length;let r=$('result');r.innerHTML='<strong>EXAMEN LEÍDO · Resultado congelado</strong><div id="grade">'+(Math.round(n*6.25)/10).toFixed(1).replace('.',',')+'</div><p>'+n+' aciertos · '+(8-n)+' errores o vacías</p><table><thead><tr><th>Pregunta</th><th>Leída / corregir</th><th>Clave</th><th>Resultado</th></tr></thead><tbody></tbody></table>';pending.forEach((a,i)=>{let tr=r.querySelector('tbody').insertRow();tr.insertCell().textContent=i+1;let sel=document.createElement('select');for(let x of ['A','B','C','D','—','DOBLE','DUDOSA'])sel.add(new Option(x,x));sel.value=a;sel.disabled=saved;sel.onchange=()=>{pending[i]=sel.value;render()};tr.insertCell().append(sel);tr.insertCell().textContent=key[i];let t=tr.insertCell();t.textContent=a===key[i]?'✓':'✗';t.className=a===key[i]?'good':'bad'});$('save').disabled=saved||pending.includes('DUDOSA');}
function scan(){if(!v.videoWidth||locked)return;let w=v.videoWidth,h=v.videoHeight;let scale=Math.min(1,1100/Math.max(w,h));W=Math.round(w*scale);H=Math.round(h*scale);if(c.width!==W||c.height!==H){c.width=W;c.height=H}ctx.drawImage(v,0,0,W,H);let d=ctx.getImageData(0,0,W,H).data;function lum(x,y){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=W||y>=H)return 255;let k=(y*W+x)*4;return Math.min(d[k],d[k+1],d[k+2])}function fail(msg){stable=0;last='';$('status').textContent=msg}
// Connected dark components, filtered by square shape and white surroundings.
let mask=new Uint8Array(W*H),queue=new Int32Array(W*H),cand=[];for(let k=0;k<mask.length;k++){let i=k*4;mask[k]=Math.max(d[i],d[i+1],d[i+2])<115?1:0}for(let k=0;k<mask.length;k++){if(!mask[k])continue;let head=0,tail=1;queue[0]=k;mask[k]=0;let x0=W,y0=H,x1=0,y1=0,sx=0,sy=0;while(head<tail){let z=queue[head++],x=z%W,y=(z/W)|0;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);sx+=x;sy+=y;for(let q of [x>0?z-1:-1,x<W-1?z+1:-1,y>0?z-W:-1,y<H-1?z+W:-1])if(q>=0&&mask[q]){mask[q]=0;queue[tail++]=q}}let bw=x1-x0+1,bh=y1-y0+1;if(bw<7||bh<7||bw>W*.13||bh>H*.13||bw/bh<.55||bw/bh>1.8||tail/(bw*bh)<.58)continue;let cx=sx/tail,cy=sy/tail,r=Math.max(bw,bh)*.85,white=0;for(let j=0;j<12;j++){let t=j*Math.PI/6;if(lum(cx+r*Math.cos(t),cy+r*Math.sin(t))>155)white++}if(white>=9)cand.push({x:cx,y:cy,size:Math.sqrt(tail)})}cand.sort((a,b)=>b.size-a.size);cand=cand.slice(0,24);let best=null;for(let a of cand)for(let b of cand){if(b.x-a.x<W*.22||Math.abs(b.y-a.y)>Math.abs(b.x-a.x)*.4)continue;for(let e of cand){if(e.y-a.y<H*.22||Math.abs(e.x-a.x)>(e.y-a.y)*.4)continue;for(let f of cand){if(f.x-e.x<W*.22||f.y-b.y<H*.22)continue;let sizes=[a,b,e,f].map(p=>p.size);if(Math.max(...sizes)/Math.min(...sizes)>2)continue;let top=Math.hypot(b.x-a.x,b.y-a.y),bottom=Math.hypot(f.x-e.x,f.y-e.y),left=Math.hypot(e.x-a.x,e.y-a.y),right=Math.hypot(f.x-b.x,f.y-b.y),ratio=(top+bottom)/(left+right);if(ratio<.48||ratio>1.02||top/bottom<.65||top/bottom>1.55||left/right<.65||left/right>1.55)continue;let err=Math.abs(ratio-.727)+Math.hypot(f.x-b.x-e.x+a.x,f.y-b.y-e.y+a.y)/(top+left);let score=top*left/(1+err*5);if(!best||score>best.score)best={score,p:[a,b,e,f],scale:(top+bottom)/1200}}}}if(!best){fail('Buscando los cuatro cuadrados negros. Muestre toda la hoja.');return}let p=best.p.map(q=>[q.x,q.y]);let [a,b,e,f]=p;let dx1=b[0]-f[0],dx2=e[0]-f[0],dx3=a[0]-b[0]-e[0]+f[0],dy1=b[1]-f[1],dy2=e[1]-f[1],dy3=a[1]-b[1]-e[1]+f[1],den=dx1*dy2-dx2*dy1;if(Math.abs(den)<1)return;let g=(dx3*dy2-dx2*dy3)/den,hp=(dx1*dy3-dx3*dy1)/den;function map(u,t){let z=1+g*u+hp*t;return [(a[0]+(b[0]-a[0]+g*b[0])*u+(e[0]-a[0]+hp*e[0])*t)/z,(a[1]+(b[1]-a[1]+g*b[1])*u+(e[1]-a[1]+hp*e[1])*t)/z]}ctx.strokeStyle='#29e890';ctx.lineWidth=2;for(let q of best.p){let r=q.size*.8;ctx.strokeRect(q.x-r,q.y-r,2*r,2*r)}let sc=best.scale; if(sc<.45){fail('Acérquese un poco para distinguir los círculos');return}let whites=0;for(let u of [.15,.35,.55,.75])for(let t of [.12,.28,.44,.60,.76,.9]){let [x,y]=map(u,t);if(lum(x,y)>160)whites++}if(whites<19){fail('No se reconoce una hoja clara');return}let answers=[],rings=0;for(let i=0;i<8;i++){let scores=[];for(let j=0;j<4;j++){let [x,y]=map((510-88.4)/435.2,(168.2+i*66.3+j*11.05-96.8)/598.4);let bg=0,nn=0,ring=0;for(let a=0;a<16;a++){let ang=a*Math.PI/8;let cs=Math.cos(ang),sn=Math.sin(ang);bg+=lum(x+8.4*sc*cs,y+8.4*sc*sn);let mn=255;for(let rr of [4.8,5.6,6.4])mn=Math.min(mn,lum(x+rr*sc*cs,y+rr*sc*sn));if(mn<150)ring++;nn++}bg/=nn;if(ring>=7)rings++;let n=0,total=0;for(let a=-4;a<=4;a++)for(let b=-4;b<=4;b++)if(a*a+b*b<=12){total++;if(lum(x+a*sc,y+b*sc)<Math.min(185,bg-42))n++}scores.push(n/total);ctx.strokeStyle=n/total>.5?'#29e890':'#00e5ff';ctx.beginPath();ctx.arc(x,y,6*sc,0,Math.PI*2);ctx.stroke()}let marked=scores.map((s,j)=>s>=.55?letters[j]:'').filter(Boolean);answers.push(marked.length>1?'DOBLE':scores.some(s=>s>=.25&&s<.55)?'DUDOSA':marked[0]||'—')}if(rings<23){fail('Ajuste distancia, enfoque y posición: círculos '+rings+'/32');return}if(answers.every(a=>a==='—')){fail('No se detectan marcas rellenas. Acerque o mejore la luz.');return}let signature=answers.join('|');stable=signature===last?stable+1:1;last=signature;$('status').textContent='Leyendo… '+stable+'/6';if(stable>=6){locked=true;pending=answers;for(const k of keys.children)k.disabled=true;render();beep();$('status').textContent='Lectura congelada. Retire el celular y verifique.';}}
$('save').onclick=()=>{let id=$('student').value.trim();if(!id||!pending){alert('Ingrese el código del estudiante');return}if(records.some(r=>r.id===id)){alert('Código ya registrado');return}let key=[...keys.children].map(s=>s.value),n=pending.filter((a,i)=>a===key[i]).length;records.push({id,answers:pending.join(' '),key:key.join(''),n,grade:(Math.round(n*6.25)/10).toFixed(1)});try{localStorage.setItem('salome2',JSON.stringify(records))}catch(e){alert('No se pudo guardar de forma persistente; exporte el CSV ahora.')}show();saved=true;render();$('status').textContent='Examen registrado. Pulse Siguiente examen.'};$('csv').onclick=()=>{let q=s=>'"'+String(s).replace(/"/g,'""')+'"';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeffCódigo;Respuestas;Clave;Aciertos;Nota\n'+records.map(r=>[r.id,r.answers,r.key,r.n,r.grade.replace('.',',')].map(q).join(';')).join('\n')],{type:'text/csv;charset=utf-8'}));a.download='salome-resultados.csv';a.click()};</script></html>

<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SALOMÉ 2.0</title><style>body{font:16px system-ui;max-width:650px;margin:auto;padding:18px;background:#f2f6f7;color:#17323a}button,input,select{font:inherit;padding:10px;margin:5px;border:1px solid #aab;border-radius:8px}button{background:#155e63;color:white}video{display:none}canvas{width:100%;background:#222}section{background:white;padding:15px;margin:12px 0;border-radius:12px}#status{font-weight:bold}table{width:100%}td{padding:5px;border-bottom:1px solid #ddd}</style><h1>SALOMÉ 2.0</h1><p>Creado por Américo Sanclemente · Prototipo OMR</p><section>Clave correcta (8 respuestas A–D)<div id="keys"></div><label>Código del estudiante <input id="student" autocomplete="off"></label><br><button id="start">Activar cámara</button><button id="stop">Detener</button><button id="next">Siguiente examen</button></section><video id="video" playsinline muted></video><canvas id="view" width="640" height="800"></canvas><p id="status">Alinee las cuatro marcas negras con los recuadros verdes.</p><section id="result">Sin lectura</section><button id="save" disabled>Confirmar y registrar</button><button id="csv">Exportar CSV</button><section id="records"></section><script>
const $=x=>document.getElementById(x), letters='ABCD', keys=$('keys');for(let i=0;i<8;i++){let s=document.createElement('select');s.setAttribute('aria-label','Pregunta '+(i+1));for(let a of letters)s.add(new Option(a,a));s.value=letters[i%4];keys.append(s)}
let stream=null,timer=null,last='',stable=0,pending=null,locked=false,records=[];try{records=JSON.parse(localStorage.getItem('salome2')||'[]')}catch(e){};const c=$('view'),ctx=c.getContext('2d',{willReadFrequently:true}),v=$('video');const targets=[[64,48],[576,48],[64,752],[576,752]];function show(){ $('records').textContent=records.length+' exámenes registrados: '+records.map(r=>r.id+' ('+r.grade+')').join(', ')}show();
function reset(){last='';stable=0;pending=null;locked=false;$('save').disabled=true;$('result').textContent='Sin lectura'}
$('next').onclick=()=>{reset();$('student').value='';$('status').textContent='Alinee el siguiente examen'};
$('start').onclick=async()=>{try{if(!navigator.mediaDevices)throw Error('Se requiere HTTPS o localhost');if(stream)return;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:1600}},audio:false});v.srcObject=stream;await v.play();timer=setInterval(scan,180)}catch(e){$('status').textContent='No se pudo activar la cámara: '+e.message}};
$('stop').onclick=()=>{clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null};
function scan(){if(!v.videoWidth)return;let w=v.videoWidth,h=v.videoHeight,sw=Math.min(w,h*.8),sh=sw/.8;ctx.drawImage(v,(w-sw)/2,(h-sh)/2,sw,sh,0,0,640,800);let d=ctx.getImageData(0,0,640,800).data;function dark(x,y){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=640||y>=800)return false;let k=(y*640+x)*4;return (d[k]+d[k+1]+d[k+2])/3<95}function marker(tx,ty){let sx=0,sy=0,n=0;for(let y=ty-26;y<=ty+26;y++)for(let x=tx-26;x<=tx+26;x++)if(dark(x,y)){sx+=x;sy+=y;n++}if(n<90||n>1000)return null;return [sx/n,sy/n]};let p=targets.map(t=>marker(...t));ctx.strokeStyle='#29e890';ctx.lineWidth=2;for(let [x,y] of targets)ctx.strokeRect(x-26,y-26,52,52);if(locked)return;if(p.some(x=>!x)){stable=0;$('status').textContent='Alinee las cuatro marcas dentro de los recuadros';return}function map(u,t){return [0,1].map(k=>(1-t)*((1-u)*p[0][k]+u*p[1][k])+t*((1-u)*p[2][k]+u*p[3][k]))}let answers=[];for(let i=0;i<8;i++){let scores=[];for(let j=0;j<4;j++){let [x,y]=map((560-64)/512,(132+i*78+j*13-48)/704);let n=0,total=0;for(let a=-3;a<=3;a++)for(let b=-3;b<=3;b++)if(a*a+b*b<=9){total++;if(dark(x+a,y+b))n++}scores.push(n/total);ctx.strokeStyle='#00e5ff';ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.stroke()}let marked=scores.map((s,j)=>s>.55?letters[j]:'').filter(Boolean);answers.push(marked.length===1?marked[0]:marked.length?'DOBLE':'—')}let signature=answers.join('|');stable=signature===last?stable+1:1;last=signature;$('status').textContent='Leyendo… '+stable+'/5';if(stable>=5){locked=true;pending=answers;let key=[...keys.children].map(s=>s.value),n=answers.filter((a,i)=>a===key[i]).length;let grade=(Math.round(n*6.25)/10).toFixed(1);$('result').textContent=answers.map((a,i)=>(i+1)+': '+a+' (clave '+key[i]+')').join(' · ')+' | '+n+'/8 | Nota '+grade;$('status').textContent='Lectura estable. Verifique antes de registrar.';$('save').disabled=false}}
$('save').onclick=()=>{let id=$('student').value.trim();if(!id||!pending){alert('Ingrese el código del estudiante');return}if(records.some(r=>r.id===id)){alert('Código ya registrado');return}let key=[...keys.children].map(s=>s.value),n=pending.filter((a,i)=>a===key[i]).length;records.push({id,answers:pending.join(' '),key:key.join(''),n,grade:(Math.round(n*6.25)/10).toFixed(1)});try{localStorage.setItem('salome2',JSON.stringify(records))}catch(e){alert('No se pudo guardar de forma persistente; exporte el CSV ahora.')}show();$('save').disabled=true};$('csv').onclick=()=>{let q=s=>'"'+String(s).replace(/"/g,'""')+'"';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeffCódigo;Respuestas;Clave;Aciertos;Nota\n'+records.map(r=>[r.id,r.answers,r.key,r.n,r.grade.replace('.',',')].map(q).join(';')).join('\n')],{type:'text/csv;charset=utf-8'}));a.download='salome-resultados.csv';a.click()};</script></html>
